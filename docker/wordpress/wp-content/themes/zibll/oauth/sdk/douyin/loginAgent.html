<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <title>抖音登录</title>
    </head>

    <body>
        <script>
            var GWC = {
                version: '1.0.0',
                urlParams: {},
                appendParams: function(url, params) {
                    if (params) {
                        var baseWithSearch = url.split('#')[0];
                        var hash = url.split('#')[1];
                        for (var key in params) {
                            var attrValue = params[key];
                            if (attrValue !== undefined) {
                                var newParam = key + "=" + attrValue;
                                if (baseWithSearch.indexOf('?') > 0) {
                                    var oldParamReg = new RegExp('^' + key + '=[-%.!~*\'\(\)\\w]*', 'g');
                                    if (oldParamReg.test(baseWithSearch)) {
                                        baseWithSearch = baseWithSearch.replace(oldParamReg, newParam);
                                    } else {
                                        baseWithSearch += "&" + newParam;
                                    }
                                } else {
                                    baseWithSearch += "?" + newParam;
                                }
                            }
                        }

                        if (hash) {
                            url = baseWithSearch + '#' + hash;
                        } else {
                            url = baseWithSearch;
                        }
                    }
                    return url;
                },
                getUrlParams: function() {
                    var pairs = location.search.substring(1).split('&');
                    for (var i = 0; i < pairs.length; i++) {
                        var pos = pairs[i].indexOf('=');
                        if (pos === -1) {
                            continue;
                        }
                        GWC.urlParams[pairs[i].substring(0, pos)] = decodeURIComponent(pairs[i].substring(pos + 1));
                    }
                },
                getCleanRedirectUri: function() {
                    return location.origin + location.pathname;
                },
                doRedirect: function() {
                    var code = GWC.urlParams['code'];
                    var appId = GWC.urlParams['client_key'];
                    var scope = GWC.urlParams['scope'];
                    var state = GWC.urlParams['state'];
                    var redirectUri;

                    if (!code) {
                        if (GWC.urlParams['redirect_uri']) {
                            sessionStorage.setItem('zib_douyin_redirect_uri', GWC.urlParams['redirect_uri']);
                        }
                        redirectUri = GWC.appendParams('https://open.douyin.com/platform/oauth/connect', {
                            'client_key': appId,
                            'redirect_uri': encodeURIComponent(GWC.getCleanRedirectUri()),
                            'response_type': 'code',
                            'scope': scope,
                            'state': state
                        });
                    } else {
                        var target = GWC.urlParams['redirect_uri'] || sessionStorage.getItem('zib_douyin_redirect_uri');
                        redirectUri = GWC.appendParams(target, {
                            'code': code,
                            'state': state
                        });
                    }

                    location.href = redirectUri;
                }
            };

            GWC.getUrlParams();
            GWC.doRedirect();
        </script>
    </body>

</html>
