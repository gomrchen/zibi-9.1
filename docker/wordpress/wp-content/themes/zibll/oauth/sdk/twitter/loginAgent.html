<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <title>Twitter登录</title>
    </head>

    <body>
        <script>
            var GWC = {
                urlParams: {},
                appendParams: function(url, params) {
                    if (!params) {
                        return url;
                    }
                    var baseWithSearch = url.split('#')[0];
                    var hash = url.split('#')[1];
                    for (var key in params) {
                        if (params[key] === undefined) {
                            continue;
                        }
                        var newParam = key + '=' + params[key];
                        if (baseWithSearch.indexOf('?') > 0) {
                            var oldParamReg = new RegExp('^' + key + '=[^&]*', 'g');
                            baseWithSearch = oldParamReg.test(baseWithSearch) ? baseWithSearch.replace(oldParamReg, newParam) : baseWithSearch + '&' + newParam;
                        } else {
                            baseWithSearch += '?' + newParam;
                        }
                    }
                    return hash ? baseWithSearch + '#' + hash : baseWithSearch;
                },
                getUrlParams: function() {
                    var pairs = location.search.substring(1).split('&');
                    for (var i = 0; i < pairs.length; i++) {
                        var pos = pairs[i].indexOf('=');
                        if (pos === -1) {
                            continue;
                        }
                        GWC.urlParams[pairs[i].substring(0, pos)] = decodeURIComponent(pairs[i].substring(pos + 1));
                    }
                },
                base64UrlEncode: function(buffer) {
                    var binary = '';
                    var bytes = new Uint8Array(buffer);
                    for (var i = 0; i < bytes.byteLength; i++) {
                        binary += String.fromCharCode(bytes[i]);
                    }
                    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                },
                doRedirect: function() {
                    var code = GWC.urlParams['code'];
                    var appId = GWC.urlParams['client_id'];
                    var scope = GWC.urlParams['scope'];
                    var state = GWC.urlParams['state'];
                    var codeVerifier = GWC.urlParams['code_verifier'];
                    var callbackUri = GWC.urlParams['redirect_uri'];

                    if (!code) {
                        if (!codeVerifier) {
                            return;
                        }
                        crypto.subtle.digest('SHA-256', new TextEncoder().encode(codeVerifier)).then(function(hashBuffer) {
                            var redirectUri = GWC.appendParams('https://x.com/i/oauth2/authorize', {
                                response_type: 'code',
                                client_id: appId,
                                redirect_uri: encodeURIComponent(location.href),
                                scope: scope,
                                state: state,
                                code_challenge: GWC.base64UrlEncode(hashBuffer),
                                code_challenge_method: 'S256'
                            });
                            location.href = redirectUri;
                        });
                        return;
                    }

                    location.href = GWC.appendParams(callbackUri, {
                        code: code,
                        state: state
                    });
                }
            };

            GWC.getUrlParams();
            GWC.doRedirect();
        </script>
    </body>

</html>
